name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradepilot
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tradepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradepilot -d tradepilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://tradepilot:testpass@localhost:5432/tradepilot_test
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars!!
          MARKET_DATA_PROVIDER: mock
          APP_ENV: test
        run: pytest -v --tb=short
